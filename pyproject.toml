[tool.black]
line-length = 100
target-version = ["py310"]
skip-string-normalization = true

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "basic"
include = [
    "models/hf_model_manager.py",
    "models/model_router.py",
    "tests",
]
exclude = [
    "**/__pycache__",
    ".git",
    "build",
    "dist",
    "venv",
    "tencent_hy3dgen",
    "*.egg-info",
]
reportMissingImports = "none"
reportMissingModuleSource = "none"
